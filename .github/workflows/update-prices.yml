name: Update Premium Prices

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 */2 * *"

permissions:
  contents: write

concurrency:
  group: update-premium-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Fragment API key
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          if [ -z "$FRAGMENT_API_KEY" ]; then
            echo "FRAGMENT_API_KEY is missing"
            exit 1
          fi

      - name: Get Fragment price list
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          curl -fsS \
            --max-time 30 \
            -H "Accept: application/json" \
            -H "X-API-Key: $FRAGMENT_API_KEY" \
            "https://api.fragment-api.io/api/prices/list" \
            -o /tmp/fragment-prices.json

          echo "Fragment API response:"
          cat /tmp/fragment-prices.json

      - name: Get TON price
        run: |
          curl -fsS \
            --max-time 30 \
            "https://api.bitpin.org/api/v1/mkt/tickers/" \
            -o /tmp/bitpin.json

          TON_PRICE=$(node scripts/read-ton-price.cjs /tmp/bitpin.json)

          if [ -z "$TON_PRICE" ]; then
            echo "TON price not found"
            exit 1
          fi

          echo "TON_PRICE=$TON_PRICE" >> "$GITHUB_ENV"

      - name: Create prices.json
        env:
          FRAGMENT_FILE: /tmp/fragment-prices.json
          TON_PRICE: ${{ env.TON_PRICE }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(process.env.FRAGMENT_FILE, "utf8")
          );

          const tonToToman = Number(process.env.TON_PRICE);

          if (!Number.isFinite(tonToToman) || tonToToman <= 0) {
            throw new Error("Invalid TON price");
          }

          function getPremium(months) {
            const name = `${months} months Telegram Premium`;

            const item = data.find(x =>
              x.product_type === "premium" &&
              x.item_name === name &&
              x.payment_method === "ton"
            );

            if (!item) {
              throw new Error(
                `Premium price not found: ${name}`
              );
            }

            return Number(item.total);
          }

          const p3 = getPremium(3);
          const p6 = getPremium(6);
          const p12 = getPremium(12);

          const toman = ton =>
            Math.round(ton * tonToToman);

          const result = {
            updatedAt: new Date().toISOString(),

            source: "fragment-api.io",

            tonToToman,

            premium: {
              single: {
                "3m": {
                  ton: p3,
                  toman: toman(p3)
                },

                "6m": {
                  ton: p6,
                  toman: toman(p6)
                },

                "12m": {
                  ton: p12,
                  toman: toman(p12)
                }
              }
            }
          };

          fs.mkdirSync("api", {
            recursive: true
          });

          fs.writeFileSync(
            "api/prices.json",
            JSON.stringify(result, null, 2) + "\n"
          );

          console.log(
            JSON.stringify(result, null, 2)
          );
          NODE

      - name: Validate prices.json
        run: |
          test -s api/prices.json

          node -e '
            const p = require("./api/prices.json");

            if (!p.premium ||
                !p.premium.single ||
                !p.premium.single["3m"] ||
                !p.premium.single["6m"] ||
                !p.premium.single["12m"]) {
              throw new Error("Premium prices are invalid");
            }

            console.log("prices.json OK");
          '

      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api/prices.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(pricing): update premium prices"
            git push
          fi
