name: Update Live Premium Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-live-premium-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Fragment API key
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          test -n "$FRAGMENT_API_KEY" || (
            echo "FRAGMENT_API_KEY is missing"
            exit 1
          )

      - name: Fetch live Premium quotes
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          set -e

          get_premium() {
            MONTHS="$1"

            echo "Requesting Premium: ${MONTHS} months"

            curl -fsS \
              --max-time 30 \
              -H "Accept: application/json" \
              -H "X-API-Key: $FRAGMENT_API_KEY" \
              "https://api.fragment-api.io/api/prices?product_type=premium&quantity=${MONTHS}&recipient=durov&payment_method=ton" \
              -o "/tmp/premium-${MONTHS}.json"

            echo "Response for ${MONTHS} months:"
            cat "/tmp/premium-${MONTHS}.json"
            echo
          }

          get_premium 3
          get_premium 6
          get_premium 12

      - name: Fetch TON price
        run: |
          curl -fsS \
            --max-time 30 \
            "https://api.bitpin.org/api/v1/mkt/tickers/" \
            -o /tmp/bitpin-tickers.json

          TON_PRICE=$(node scripts/read-ton-price.cjs /tmp/bitpin-tickers.json)

          test -n "$TON_PRICE" || (
            echo "TON price could not be determined"
            exit 1
          )

          echo "TON_PRICE=$TON_PRICE" >> "$GITHUB_ENV"
          echo "TON price: $TON_PRICE"

      - name: Generate Premium prices.json
        env:
          TON_PRICE: ${{ env.TON_PRICE }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tonToToman = Number(process.env.TON_PRICE);

          if (!Number.isFinite(tonToToman) || tonToToman <= 0) {
            throw new Error("Invalid TON price: " + process.env.TON_PRICE);
          }

          function readQuote(months) {
            const file = `/tmp/premium-${months}.json`;

            const data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );

            if (
              !data ||
              typeof data.total !== "number" ||
              data.total <= 0
            ) {
              throw new Error(
                `Invalid Premium quote for ${months} months`
              );
            }

            return data;
          }

          const q3 = readQuote(3);
          const q6 = readQuote(6);
          const q12 = readQuote(12);

          function toman(ton) {
            return Math.round(ton * tonToToman);
          }

          const result = {
            updatedAt: new Date().toISOString(),

            source: "fragment-api.io/live",

            tonToToman,

            premium: {
              single: {
                "3m": {
                  ton: q3.total,
                  toman: toman(q3.total)
                },

                "6m": {
                  ton: q6.total,
                  toman: toman(q6.total)
                },

                "12m": {
                  ton: q12.total,
                  toman: toman(q12.total)
                }
              }
            }
          };

          fs.mkdirSync("api", { recursive: true });

          fs.writeFileSync(
            "api/prices.json",
            JSON.stringify(result, null, 2) + "\n"
          );

          console.log(
            "Generated api/prices.json:"
          );

          console.log(
            JSON.stringify(result, null, 2)
          );
          NODE

      - name: Validate generated prices
        run: |
          test -s api/prices.json

          node <<'NODE'
          const p = require("./api/prices.json");

          if (!p.premium) {
            throw new Error("Premium section missing");
          }

          for (const month of ["3m", "6m", "12m"]) {
            const item = p.premium.single[month];

            if (
              !item ||
              typeof item.ton !== "number" ||
              typeof item.toman !== "number"
            ) {
              throw new Error(
                `Invalid Premium price: ${month}`
              );
            }
          }

          console.log("Premium prices are valid.");
          NODE

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api/prices.json

          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "chore(pricing): update live Premium prices"
            git push
          fi
