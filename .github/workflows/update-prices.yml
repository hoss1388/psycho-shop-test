name: Update Live Premium Prices

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate live Fragment and Bitpin data without committing prices.json"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-live-premium-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secret
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          test -n "$FRAGMENT_API_KEY" || (echo "FRAGMENT_API_KEY is missing" && exit 1)

      - name: Fetch current Fragment price list
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
        run: |
          curl -fsS --max-time 30 \
            -H "X-API-Key: $FRAGMENT_API_KEY" \
            "https://api.fragment-api.io/api/prices/list" \
            -o /tmp/fragment-prices.json

      - name: Fetch current TON to toman rate
        run: |
          curl -fsS --max-time 30 \
            "https://api.bitpin.org/api/v1/mkt/tickers/" \
            -o /tmp/bitpin-tickers.json

          TON_PRICE=$(node scripts/read-ton-price.cjs /tmp/bitpin-tickers.json)
          echo "TON_PRICE=$TON_PRICE" >> "$GITHUB_ENV"

      - name: Fetch and convert current Premium quotes
        env:
          FRAGMENT_API_KEY: ${{ secrets.FRAGMENT_API_KEY }}
          FRAGMENT_PRICES_FILE: /tmp/fragment-prices.json
        run: |
          node scripts/convert-prices.cjs

      - name: Validate generated prices and health
        run: |
          MAX_PRICE_AGE_SECONDS=900 node scripts/validate-prices.cjs api/prices.json

      - name: Commit fresh price data
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/prices.json
          git diff --cached --quiet || (
            git commit -m "chore(pricing): refresh live Fragment Premium quotes"
            git push
          )
